<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鴨爸爸滷味大亨：濱海一路門市</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0d0a08;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .font-title {
            font-family: 'ZCOOL KuaiLe', 'Noto Sans TC', cursive, sans-serif;
        }
        .order-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .tab-active {
            border-bottom: 3px solid #f59e0b;
            color: #fbbf24;
            font-weight: 700;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(24, 24, 27, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MENU_ITEMS = [
            { id: 'tofu', name: '招牌豆干', icon: '🧈', price: 30, prepTime: 0.8 },
            { id: 'noodle', name: '古早味乾麵', icon: '🍜', price: 50, prepTime: 1.5 },
            { id: 'ear', name: '秘製豬耳朵', icon: '🐷', price: 60, prepTime: 1.0 },
            { id: 'beef', name: '香滷牛腱', icon: '🥩', price: 120, prepTime: 2.0 },
        ];

        const CUSTOMER_TYPES = [
            { name: '西子灣大學生', avatar: '🎓', patience: 14 },
            { name: '濱海一路老街坊', avatar: '👵', patience: 18 },
            { name: '中山大學研究生', avatar: '💻', patience: 12 },
            { name: '集町預購團友', avatar: '📦', patience: 20 },
            { name: '哈瑪星美食客', avatar: '🛵', patience: 15 },
        ];

        const SHOP_TITLES = [
            'LV.1 路邊攤古早味麵攤',
            'LV.2 哈瑪星排隊名店',
            'LV.3 濱海一路熱銷總店',
            'LV.4 鴨爸爸旗艦滷味王國',
        ];

        function App() {
            const [money, setMoney] = useState(150);
            const [rep, setRep] = useState(10);
            const [shopLevel, setShopLevel] = useState(1);
            const [currentTab, setCurrentTab] = useState('shop');

            // 經營狀態
            const [customer, setCustomer] = useState(null);
            const [preparedItems, setPreparedItems] = useState([]);
            const [kitchenStatus, setKitchenStatus] = useState('IDLE');
            const [cookingItem, setCookingItem] = useState(null);

            // 分享彈窗與提示
            const [showShareModal, setShowShareModal] = useState(false);
            const [toastMsg, setToastMsg] = useState('');

            // 預購購物車
            const [cart, setCart] = useState({});
            const [claimedCoupon, setClaimedCoupon] = useState(false);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            };

            // 隨機產生顧客上門
            const spawnCustomer = () => {
                if (customer) return;
                const type = CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)];
                
                const itemCount = Math.min(MENU_ITEMS.length, Math.floor(Math.random() * Math.min(2 + shopLevel, 4)) + 1);
                const items = [];
                for (let i = 0; i < itemCount; i++) {
                    items.push(MENU_ITEMS[Math.floor(Math.random() * MENU_ITEMS.length)]);
                }

                setCustomer({
                    ...type,
                    id: Date.now(),
                    items,
                    timeLeft: type.patience,
                    maxTime: type.patience,
                });
                setPreparedItems([]);
            };

            // 顧客耐心計時
            useEffect(() => {
                let timer = null;
                if (customer) {
                    timer = setInterval(() => {
                        setCustomer(prev => {
                            if (!prev) return null;
                            if (prev.timeLeft <= 1) {
                                setRep(r => Math.max(0, r - 2));
                                setPreparedItems([]);
                                return null;
                            }
                            return { ...prev, timeLeft: prev.timeLeft - 1 };
                        });
                    }, 1000);
                } else {
                    timer = setTimeout(spawnCustomer, 2000);
                }
                return () => {
                    clearInterval(timer);
                    clearTimeout(timer);
                };
            }, [customer]);

            // 製作餐點
            const prepareFood = (item) => {
                if (!customer || kitchenStatus === 'COOKING') return;

                setKitchenStatus('COOKING');
                setCookingItem(item.name);

                setTimeout(() => {
                    const newPrepared = [...preparedItems, item.id];
                    setPreparedItems(newPrepared);
                    setKitchenStatus('IDLE');
                    setCookingItem(null);

                    const requiredIds = customer.items.map(i => i.id).sort();
                    const currentIds = [...newPrepared].sort();

                    if (JSON.stringify(requiredIds) === JSON.stringify(currentIds)) {
                        const totalEarn = customer.items.reduce((sum, i) => sum + i.price, 0);
                        const bonus = customer.timeLeft > customer.maxTime * 0.5 ? 20 : 0;
                        setMoney(m => m + totalEarn + bonus);
                        setRep(r => r + 1);
                        setCustomer(null);
                        setPreparedItems([]);
                        showToast(`🎉 出餐成功！賺得 $${totalEarn + bonus}！`);
                    }
                }, item.prepTime * 1000);
            };

            // 升級門市
            const upgradeShop = () => {
                const cost = shopLevel * 350;
                if (money < cost) {
                    showToast(`⚠️ 營業金不足！擴大店面需要 $${cost}`);
                    return;
                }
                setMoney(m => m - cost);
                setShopLevel(l => Math.min(SHOP_TITLES.length, l + 1));
                showToast(`🎊 門市升級成功！吸引更多顧客！`);
            };

            // 複製連結
            const handleCopyLink = () => {
                const url = window.location.href;
                const tempInput = document.createElement("input");
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast("📋 遊戲網址已複製到剪貼簿！");
            };

            // 分享至 LINE
            const handleShareLine = () => {
                const currentUrl = encodeURIComponent(window.location.href);
                const shareText = encodeURIComponent("鴨爸爸濱海一路門市《滷味大亨》試營運中！快來一起賣乾麵、切滷味領專屬折價券！");
                window.open(`https://line.me/R/msg/text/?${shareText}%20${currentUrl}`, '_blank');
            };

            // 複製推薦文案
            const handleCopyPromoText = () => {
                const text = `鴨爸爸濱海一路門市《滷味大亨》試營運中！快來一起賣乾麵、切滷味領專屬滿額 $30 折價券！\n👉 點我立即體驗遊戲：${window.location.href}`;
                const tempInput = document.createElement("textarea");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast("📱 推薦文案已複製！快發到 FB/LINE 群組！");
            };

            return (
                <div className="max-w-md mx-auto h-screen flex flex-col bg-stone-950 text-stone-100 select-none relative overflow-hidden border-x border-stone-800 shadow-2xl">
                    
                    <div className="bg-gradient-to-b from-amber-950 via-stone-900 to-stone-950 p-3.5 border-b border-amber-900/60 shadow-xl flex justify-between items-center z-10">
                        <div>
                            <div className="text-[10px] text-amber-500 font-bold tracking-widest uppercase">鴨爸爸滷味 · 高雄濱海一路門市</div>
                            <div className="text-base font-black text-amber-300 font-title flex items-center gap-1">
                                <span>🏪</span> {SHOP_TITLES[shopLevel - 1]}
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => setShowShareModal(true)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl shadow border border-emerald-400 flex items-center gap-1 active:scale-95 transition-all animate-pulse"
                            >
                                <span>🟢</span> 分享好友
                            </button>
                        </div>
                    </div>

                    {currentTab === 'shop' && (
                        <div className="flex-1 p-4 flex flex-col justify-between relative overflow-hidden custom-scrollbar overflow-y-auto">
                            
                            {/* 顧客點餐區 */}
                            <div className="bg-stone-900/90 p-4 rounded-2xl border border-amber-800/60 shadow-xl min-h-[170px] flex flex-col justify-between relative">
                                {customer ? (
                                    <div className="order-pop">
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="flex items-center gap-2.5">
                                                <span className="text-4xl p-1 bg-stone-950 rounded-2xl border border-stone-800">{customer.avatar}</span>
                                                <div>
                                                    <div className="font-bold text-sm text-amber-200">{customer.name}</div>
                                                    <div className="text-[10px] text-stone-400 mt-0.5">
                                                        耐心值: <span className={customer.timeLeft <= 5 ? 'text-red-400 font-bold animate-pulse' : 'text-amber-400'}>{customer.timeLeft}s</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <span className="text-[11px] bg-amber-950/80 border border-amber-800 px-2.5 py-1 rounded-full text-amber-400 font-bold">
                                                點餐中
                                            </span>
                                        </div>

                                        <div className="w-full bg-stone-950 h-1.5 rounded-full overflow-hidden my-2 border border-stone-800">
                                            <div 
                                                className={`h-full transition-all duration-1000 ${customer.timeLeft <= 5 ? 'bg-red-500' : 'bg-amber-500'}`}
                                                style={{ width: `${(customer.timeLeft / customer.maxTime) * 100}%` }}
                                            ></div>
                                        </div>

                                        <div className="bg-stone-950 p-2.5 rounded-xl border border-stone-800 flex items-center justify-between gap-2 mt-2">
                                            <span className="text-xs text-stone-400 font-bold whitespace-nowrap">點餐品項:</span>
                                            <div className="flex flex-wrap gap-1.5 justify-end">
                                                {customer.items.map((item, idx) => {
                                                    const isPrepared = preparedItems.filter(id => id === item.id).length > 
                                                        customer.items.slice(0, idx).filter(i => i.id === item.id).length;
                                                    return (
                                                        <div 
                                                            key={idx} 
                                                            className={`flex items-center gap-1 px-2.5 py-1 rounded-lg border text-xs transition-all ${
                                                                isPrepared 
                                                                    ? 'bg-emerald-950/80 border-emerald-600 text-emerald-300 line-through opacity-80' 
                                                                    : 'bg-stone-900 border-amber-900/50 text-amber-300 font-bold'
                                                            }`}
                                                        >
                                                            <span>{item.icon}</span>
                                                            <span>{item.name}</span>
                                                            {isPrepared && <span>✓</span>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="my-auto text-center py-6">
                                        <div className="text-3xl mb-1 animate-bounce">🚶‍♂️</div>
                                        <div className="text-xs text-stone-400 font-bold">顧客正走進高雄濱海一路門市...</div>
                                    </div>
                                )}
                            </div>

                            {/* 中央出餐廚房檯 */}
                            <div className="my-3 space-y-3">
                                <div className="text-xs font-bold text-amber-400 flex justify-between items-center px-1">
                                    <span className="flex items-center gap-1">👨‍🍳 鴨爸爸料理廚房檯</span>
                                    <span className="text-[11px] text-amber-500/80 font-normal">
                                        {kitchenStatus === 'COOKING' ? `♨️ 正在切/熬煮 ${cookingItem}...` : '待命中 (點擊開始製作)'}
                                    </span>
                                </div>

                                <div className="grid grid-cols-2 gap-2.5">
                                    {MENU_ITEMS.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => prepareFood(item)}
                                            disabled={!customer || kitchenStatus === 'COOKING'}
                                            className="bg-gradient-to-r from-stone-900 via-stone-900 to-stone-850 border border-amber-900/50 hover:border-amber-500 p-3 rounded-2xl flex items-center justify-between active:scale-95 transition-all disabled:opacity-40 shadow-lg relative overflow-hidden group"
                                        >
                                            <div className="flex items-center gap-2.5">
                                                <span className="text-3xl group-hover:scale-110 transition-transform">{item.icon}</span>
                                                <div className="text-left">
                                                    <div className="font-bold text-xs text-stone-200">{item.name}</div>
                                                    <div className="text-[11px] text-amber-400 font-black">${item.price}</div>
                                                </div>
                                            </div>
                                            <span className="text-[10px] bg-amber-600/30 text-amber-300 border border-amber-600/50 px-2 py-1 rounded-lg font-bold">
                                                +製作
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* 店面升級按鈕 */}
                            <button
                                onClick={upgradeShop}
                                disabled={shopLevel >= SHOP_TITLES.length}
                                className="w-full bg-gradient-to-r from-amber-500 via-amber-600 to-yellow-600 text-stone-950 font-black py-3.5 rounded-2xl text-sm shadow-[0_4px_20px_rgba(245,158,11,0.3)] active:scale-95 transition-all border border-amber-300/40 disabled:opacity-50"
                            >
                                {shopLevel >= SHOP_TITLES.length 
                                    ? '🏆 已升級至頂級鴨爸爸旗艦總店' 
                                    : `🚀 擴大門市等級 (需 $${shopLevel * 350} 營業金)`}
                            </button>
                        </div>
                    )}

                    {/* 頁面 2：集町快閃預購與實體折價券 */}
                    {currentTab === 'o2o' && (
                        <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-4">
                            <div className="bg-stone-900/90 p-4 rounded-2xl border border-amber-600/50 shadow-xl relative overflow-hidden">
                                <div className="flex justify-between items-start mb-2">
                                    <div>
                                        <h3 className="font-bold text-amber-400 text-sm flex items-center gap-1">
                                            <span>📜</span> 店長專屬實體門市核銷券
                                        </h3>
                                        <p className="text-[11px] text-stone-400">店面升級至 LV.2 解鎖高雄濱海一路店專屬優惠</p>
                                    </div>
                                    <span className="bg-amber-950 text-amber-300 text-[10px] px-2 py-0.5 rounded border border-amber-800">
                                        店長特權
                                    </span>
                                </div>

                                {shopLevel < 2 ? (
                                    <div className="text-center py-6 bg-stone-950/80 rounded-xl border border-stone-800 text-stone-500 text-xs my-2">
                                        🔒 門市升級至 LV.2 解鎖實體門市滿 $200 折 $30 券
                                    </div>
                                ) : (
                                    <div className="bg-gradient-to-r from-amber-950/80 to-stone-900 p-3.5 rounded-xl border border-amber-600/60 flex justify-between items-center my-2 shadow-inner">
                                        <div>
                                            <div className="font-black text-amber-300 text-sm">集町快閃預購滿 $200 折 $30 券</div>
                                            <div className="text-[10px] text-stone-400">現場出示本畫面予店員即可核銷</div>
                                        </div>
                                        <button 
                                            onClick={() => {
                                                setClaimedCoupon(true);
                                                showToast("🎉 折價券領取成功！請於濱海一路門市現場出示。");
                                            }}
                                            disabled={claimedCoupon}
                                            className="bg-amber-500 text-stone-950 px-3 py-1.5 rounded-lg text-xs font-black shadow active:scale-95 disabled:opacity-50"
                                        >
                                            {claimedCoupon ? '已領取' : '點擊領取'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="space-y-2.5">
                                <div className="flex justify-between items-center px-1">
                                    <h3 className="font-bold text-amber-400 text-sm">📦 集町真空滷味快閃預購</h3>
                                    <span className="text-[10px] text-stone-500">濱海一路門市取貨</span>
                                </div>

                                {[
                                    { id: 'beef', name: '真空香滷牛腱', price: 280, desc: '特選牛腱心，秘製老滷慢燉破表香氣' },
                                    { id: 'ear', name: '真空秘製豬耳朵', price: 150, desc: '煙燻爽脆，搭配啤酒最絕配' },
                                    { id: 'tofu', name: '真空招牌豆干(大)', price: 100, desc: '吸滿百年老滷汁，咬下爆汁' },
                                ].map((item) => (
                                    <div key={item.id} className="bg-stone-900/90 p-3.5 rounded-2xl border border-stone-800 flex justify-between items-center shadow-lg">
                                        <div className="pr-2">
                                            <div className="font-bold text-xs text-stone-200">{item.name}</div>
                                            <div className="text-[10px] text-stone-500 mt-0.5">{item.desc}</div>
                                            <div className="text-amber-400 font-black text-xs mt-1.5">${item.price}</div>
                                        </div>
                                        <div className="flex items-center gap-2 bg-stone-950 px-2.5 py-1.5 rounded-xl border border-stone-800">
                                            <button 
                                                onClick={() => {
                                                    const cur = cart[item.id] || 0;
                                                    setCart({ ...cart, [item.id]: Math.max(0, cur - 1) });
                                                }}
                                                className="w-5 h-5 bg-stone-800 text-stone-200 rounded font-bold text-xs flex items-center justify-center active:scale-95"
                                            >
                                                -
                                            </button>
                                            <span className="text-xs font-bold text-amber-300 min-w-[16px] text-center">
                                                {cart[item.id] || 0}
                                            </span>
                                            <button 
                                                onClick={() => {
                                                    const cur = cart[item.id] || 0;
                                                    setCart({ ...cart, [item.id]: cur + 1 });
                                                }}
                                                className="w-5 h-5 bg-amber-600 text-stone-950 rounded font-bold text-xs flex items-center justify-center active:scale-95"
                                            >
                                                +
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 獨立彈窗：一鍵分享至社交平台與 LINE */}
                    {showShareModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 order-pop">
                            <div className="bg-stone-900 border border-amber-800/80 rounded-3xl p-5 max-w-xs w-full text-center shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-stone-800 pb-2">
                                    <h3 className="font-bold text-amber-300 text-base flex items-center gap-1.5">
                                        <span>📲</span> 分享《鴨爸爸滷味大亨》
                                    </h3>
                                    <button 
                                        onClick={() => setShowShareModal(false)}
                                        className="text-stone-400 text-lg hover:text-white"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-2.5 text-left text-xs">
                                    {/* 按鈕 1: 直接 LINE 分享 */}
                                    <button 
                                        onClick={handleShareLine}
                                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-between shadow active:scale-95 transition-all"
                                    >
                                        <span className="flex items-center gap-2">
                                            <span className="text-base">🟢</span>
                                            <span>一鍵 LINE 傳給好友/群組</span>
                                        </span>
                                        <span>➔</span>
                                    </button>

                                    {/* 按鈕 2: 複製連結 */}
                                    <button 
                                        onClick={handleCopyLink}
                                        className="w-full bg-stone-800 hover:bg-stone-700 text-amber-300 border border-amber-900/60 font-bold py-3 px-4 rounded-xl flex items-center justify-between active:scale-95 transition-all"
                                    >
                                        <span className="flex items-center gap-2">
                                            <span className="text-base">📋</span>
                                            <span>複製遊戲網址</span>
                                        </span>
                                        <span>複製</span>
                                    </button>

                                    {/* 按鈕 3: 複製完整推薦文案 */}
                                    <button 
                                        onClick={handleCopyPromoText}
                                        className="w-full bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700 font-bold py-3 px-4 rounded-xl flex items-center justify-between active:scale-95 transition-all"
                                    >
                                        <span className="flex items-center gap-2">
                                            <span className="text-base">📱</span>
                                            <span>複製 FB/社群圖文推薦</span>
                                        </span>
                                        <span>複製</span>
                                    </button>
                                </div>

                                <button 
                                    onClick={() => setShowShareModal(false)}
                                    className="w-full bg-stone-950 text-stone-400 py-2 rounded-xl text-xs font-bold border border-stone-800"
                                >
                                    返回遊戲
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Toast 提示訊息 */}
                    {toastMsg && (
                        <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-amber-500 text-stone-950 font-black px-4 py-2 rounded-full text-xs shadow-2xl z-50 animate-bounce border border-amber-200">
                            {toastMsg}
                        </div>
                    )}

                    {/* 底部導覽選單 */}
                    <div className="bg-stone-950 border-t border-amber-900/60 flex text-stone-400 text-xs">
                        <button 
                            onClick={() => setCurrentTab('shop')} 
                            className={`flex-1 py-3.5 text-center font-bold transition-colors ${currentTab === 'shop' ? 'tab-active bg-stone-900/60' : ''}`}
                        >
                            🍜 鴨爸爸麵攤經營
                        </button>
                        <button 
                            onClick={() => setCurrentTab('o2o')} 
                            className={`flex-1 py-3.5 text-center font-bold transition-colors ${currentTab === 'o2o' ? 'tab-active bg-stone-900/60' : ''}`}
                        >
                            📦 集町預購與獎勵
                        </button>
                        <button 
                            onClick={() => setShowShareModal(true)} 
                            className="flex-1 py-3.5 text-center font-bold text-emerald-400 bg-stone-900/40 hover:bg-stone-900/80"
                        >
                            📲 分享好友
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
