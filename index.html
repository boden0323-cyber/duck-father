<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鴨爸爸 2D Arcade Idle 滷味大亨</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1512; color: #fff; font-family: sans-serif; overflow: hidden; user-select: none; }
        #game-container { width: 100vw; height: 80vh; margin: 0 auto; }
        #ui-layer { height: 20vh; background: #261e19; border-t: 2px solid #d97706; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer" class="flex justify-between items-center px-4">
        <div>
            <div class="text-xs text-amber-400 font-bold">鴨爸爸實體兌換 Arcade Idle</div>
            <div id="revenue-text" class="text-sm font-black text-amber-200">總營業額: $0</div>
            <div id="task-text" class="text-xs text-stone-300">任務: 拿取滷味送給顧客！</div>
        </div>
        <button id="reward-btn" class="bg-amber-500 hover:bg-amber-400 text-stone-950 font-black px-4 py-2 rounded-xl text-xs shadow-lg active:scale-95">
            🎁 兌換衛生紙 / 滷味
        </button>
    </div>

    <script>
        // Phaser 3 遊戲配置
        const config = {
            type: Phaser.AUTO,
            width: 360,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: { debug: false }
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        let player;
        let cursors;
        let money = 0;
        let totalRevenue = 0;
        let carriedFood = 0;
        const maxCarry = 3;

        let foodStation;
        let counterStation;
        let foodText;
        let statusText;

        function preload() {
            // 自動生成簡意幾何圖案作為遊戲素材
        }

        function create() {
            const scene = this;

            // 1. 繪製店面地板與區域
            const graphics = scene.add.graphics();
            graphics.fillStyle(0x3a2e2b, 1);
            graphics.fillRect(20, 20, 320, 560); // 地板

            // 廚房區 (左上)
            graphics.fillStyle(0x78350f, 1);
            graphics.fillRect(40, 50, 100, 80);
            scene.add.text(50, 80, '♨️ 滷味檯', { font: '14px Arial', fill: '#fbbf24' });

            // 點餐櫃檯 (右上)
            graphics.fillStyle(0x1e3a8a, 1);
            graphics.fillRect(220, 50, 100, 80);
            scene.add.text(235, 80, '🧍 顧客檯', { font: '14px Arial', fill: '#93c5fd' });

            // 實體衛生紙兌換站 (下方)
            graphics.fillStyle(0x065f46, 1);
            graphics.fillRect(110, 420, 140, 80);
            scene.add.text(125, 450, '🧻 衛生紙站', { font: '14px Arial', fill: '#6ee7b7' });

            // 2. 角色 (玩家小人)
            player = scene.add.circle(180, 300, 15, 0xf59e0b);
            scene.physics.add.existing(player);
            player.body.setCollideWorldBounds(true);

            // 玩家攜態文字
            foodText = scene.add.text(180, 270, '', { font: '12px Arial', fill: '#ffffff' }).setOrigin(0.5);

            // 觸控 / 方向鍵
            cursors = scene.input.keyboard.createCursorKeys();

            // 手機螢幕滑動/點擊移動支援
            scene.input.on('pointermove', function (pointer) {
                if (pointer.isDown) {
                    scene.physics.moveToObject(player, pointer, 160);
                }
            });

            scene.input.on('pointerup', function () {
                player.body.setVelocity(0, 0);
            });

            // 3. 碰撞與區域感應邏輯
            // 靠近廚房補貨
            scene.time.addEvent({
                delay: 300,
                callback: () => {
                    // 靠近滷味檯 (x:40~140, y:50~130)
                    if (Phaser.Math.Distance.Between(player.x, player.y, 90, 90) < 50) {
                        if (carriedFood < maxCarry) {
                            carriedFood++;
                            foodText.setText(`🍱 x${carriedFood}`);
                        }
                    }

                    // 靠近顧客檯出餐 (x:220~320, y:50~130)
                    if (Phaser.Math.Distance.Between(player.x, player.y, 270, 90) < 50) {
                        if (carriedFood > 0) {
                            carriedFood--;
                            totalRevenue += 50;
                            foodText.setText(carriedFood > 0 ? `🍱 x${carriedFood}` : '');
                            document.getElementById('revenue-text').innerText = `總營業額: $${totalRevenue}`;
                        }
                    }
                },
                loop: true
            });
        }

        function update() {
            // 電腦鍵盤控制
            player.body.setVelocity(0);

            if (cursors.left.isDown) player.body.setVelocityX(-160);
            else if (cursors.right.isDown) player.body.setVelocityX(160);

            if (cursors.up.isDown) player.body.setVelocityY(-160);
            else if (cursors.down.isDown) player.body.setVelocityY(160);

            foodText.setPosition(player.x, player.y - 25);
        }

        // UI 兌換按鈕事件
        document.getElementById('reward-btn').addEventListener('click', () => {
            if (totalRevenue >= 500) {
                alert(`🎉 恭喜！您已累積營業額 $${totalRevenue}！\n獲得【集町抽取式衛生紙 1 包】免費兌換碼：TISSUE-PHASER\n可憑此畫面至高雄濱海一路門市核銷！`);
            } else {
                alert(`目前總營業額 $${totalRevenue}，還差 $${500 - totalRevenue} 即可免費兌換衛生紙！快操控小人繼續切滷味送餐！`);
            }
        });
    </script>
</body>
</html>
