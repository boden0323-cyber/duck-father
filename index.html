<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鴨爸爸滷味大亨：濱海一路任務兌換版</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #120e0b; color: #eee; user-select: none; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 3px solid #f59e0b; color: #fbbf24; font-weight: bold; }
        .smooth-move { transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MENU_ITEMS = [
            { id: 'noodle_dry', name: '古早味乾麵', icon: '🍜', price: 50 },
            { id: 'noodle_sesame', name: '香濃麻醬麵', icon: '🍜', price: 55 },
            { id: 'tofu', name: '招牌豆干', icon: '🧈', price: 30 },
            { id: 'kelp', name: '爽口海帶', icon: '🌿', price: 30 },
            { id: 'ear', name: '秘製豬耳朵', icon: '🐷', price: 60 },
            { id: 'egg', name: '爆汁滷蛋', icon: '🥚', price: 15 },
            { id: 'soup_wonton', name: '鮮美餛飩湯', icon: '🥣', price: 45 },
        ];

        const CUSTOMER_TYPES = [
            { name: '西子灣學生', avatar: '🎓', patience: 15 },
            { name: '哈瑪星美食客', avatar: '🛵', patience: 14 },
            { name: '濱海一路老街坊', avatar: '👵', patience: 18 },
            { name: '集町團購團友', avatar: '📦', patience: 20 },
        ];

        // 10 級門市升級地圖配置
        const SHOP_LEVELS = [
            { level: 1, name: '濱海古早味麵攤', reqRep: 0, reqMoney: 0, buff: '基礎出餐模式' },
            { level: 2, name: '社區排隊名店', reqRep: 15, reqMoney: 300, buff: '顧客耐心 +2 秒' },
            { level: 3, name: '哈瑪星美食地標', reqRep: 35, reqMoney: 800, buff: '解鎖實體團購取貨點' },
            { level: 4, name: '集町聯合發貨站', reqRep: 60, reqMoney: 1500, buff: '出餐獲利額外 +10%' },
            { level: 5, name: '鼓山區網路名店', reqRep: 100, reqMoney: 3000, buff: '顧客滿意小費翻倍' },
            { level: 6, name: '祕製老滷旗艦店', reqRep: 150, reqMoney: 5000, buff: '獲得助手「阿傑」協助出餐' },
            { level: 7, name: '高雄人氣老字號', reqRep: 220, reqMoney: 8000, buff: '所有餐點售價永久 +$10' },
            { level: 8, name: '跨區連盟配送中心', reqRep: 300, reqMoney: 12000, buff: '解鎖隱藏霸王拼盤' },
            { level: 9, name: '百年傳承老滷王', reqRep: 400, reqMoney: 18000, buff: '好評升級速度加倍' },
            { level: 10, name: '鴨爸爸餐飲帝國', reqRep: 500, reqMoney: 25000, buff: '榮登鼓山美食帝王榜' },
        ];

        function App() {
            const [money, setMoney] = useState(() => Number(localStorage.getItem('duck_money') || 150));
            const [totalRevenue, setTotalRevenue] = useState(() => Number(localStorage.getItem('duck_revenue') || 150));
            const [rep, setRep] = useState(() => Number(localStorage.getItem('duck_rep') || 5));
            const [shopLevel, setShopLevel] = useState(() => Number(localStorage.getItem('duck_level') || 1));

            useEffect(() => { localStorage.setItem('duck_money', money); }, [money]);
            useEffect(() => { localStorage.setItem('duck_revenue', totalRevenue); }, [totalRevenue]);
            useEffect(() => { localStorage.setItem('duck_rep', rep); }, [rep]);
            useEffect(() => { localStorage.setItem('duck_level', shopLevel); }, [shopLevel]);

            const [currentTab, setCurrentTab] = useState('arcade');
            const [activeCoupon, setActiveCoupon] = useState(null);
            const [showShareModal, setShowShareModal] = useState(false);

            const [currentCustomer, setCurrentCustomer] = useState(null);
            const [cookingItem, setCookingItem] = useState(null);
            const [carriedItem, setCarriedItem] = useState(null);

            const [playerPos, setPlayerPos] = useState('center');

            const currentShopInfo = SHOP_LEVELS.find(s => s.level === shopLevel) || SHOP_LEVELS[0];
            const nextShopInfo = SHOP_LEVELS.find(s => s.level === shopLevel + 1);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (!currentCustomer) {
                        const type = CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)];
                        const requestedItem = MENU_ITEMS[Math.floor(Math.random() * MENU_ITEMS.length)];
                        const patienceBonus = shopLevel >= 2 ? 2 : 0;
                        setCurrentCustomer({
                            ...type,
                            order: requestedItem,
                            timeLeft: type.patience + patienceBonus
                        });
                    }
                }, 2000);
                return () => clearInterval(interval);
            }, [currentCustomer, shopLevel]);

            useEffect(() => {
                if (!currentCustomer) return;
                const timer = setInterval(() => {
                    setCurrentCustomer(prev => {
                        if (!prev) return null;
                        if (prev.timeLeft <= 1) {
                            setRep(r => Math.max(0, r - 1));
                            return null;
                        }
                        return { ...prev, timeLeft: prev.timeLeft - 1 };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [currentCustomer]);

            const goToKitchen = () => {
                setPlayerPos('kitchen');
                setTimeout(() => {
                    if (cookingItem && !carriedItem) {
                        setCarriedItem(cookingItem);
                        setCookingItem(null);
                    }
                }, 400);
            };

            const goToCounter = () => {
                setPlayerPos('counter');
                setTimeout(() => {
                    if (carriedItem && currentCustomer) {
                        if (carriedItem.id === currentCustomer.order.id || carriedItem.name === currentCustomer.order.name) {
                            let baseEarn = carriedItem.price;
                            if (shopLevel >= 4) baseEarn = Math.round(baseEarn * 1.1);
                            if (shopLevel >= 7) baseEarn += 10;

                            setMoney(m => m + baseEarn);
                            setTotalRevenue(r => r + baseEarn);
                            setRep(r => r + 1);
                            setCarriedItem(null);
                            setCurrentCustomer(null);
                            setPlayerPos('center');
                            alert(`🎉 成功送餐【${carriedItem.name}】！賺取 $${baseEarn} 營業金，⭐ 好評度 +1！`);
                        } else {
                            setRep(r => Math.max(0, r - 1));
                            alert(`❌ 送錯菜了！客人想吃的是【${currentCustomer.order.name}】！⭐ 好評度 -1！`);
                        }
                    } else if (!carriedItem) {
                        alert('手上沒有菜喔！請先點擊菜色做菜，再點擊「廚房備餐檯」取餐！');
                    }
                }, 400);
            };

            const upgradeShop = () => {
                if (!nextShopInfo) {
                    alert('🎊 恭喜！您已將鴨爸爸門市升級至最高等級【鴨爸爸餐飲帝國】！');
                    return;
                }

                if (rep < nextShopInfo.reqRep) {
                    alert(`升級條件不足！需要 ⭐ 好評度達到 ${nextShopInfo.reqRep} 星（目前 ${rep} 星）！`);
                    return;
                }

                if (money < nextShopInfo.reqMoney) {
                    alert(`營業金不足！升級至 LV.${nextShopInfo.level}【${nextShopInfo.name}】需要 $${nextShopInfo.reqMoney}（目前 $${money}）！`);
                    return;
                }

                setMoney(m => m - nextShopInfo.reqMoney);
                setShopLevel(l => l + 1);
                alert(`🎊 恭喜！鴨爸爸門市順利升級至 LV.${nextShopInfo.level}【${nextShopInfo.name}】！\n解鎖特權：${nextShopInfo.buff}`);
            };

            const resetGameData = () => {
                if (confirm('確定要重置所有遊戲進度與營業額嗎？')) {
                    localStorage.clear();
                    setMoney(150);
                    setTotalRevenue(150);
                    setRep(5);
                    setShopLevel(1);
                    alert('遊戲存檔已重置！');
                }
            };

            const gameUrl = window.location.href.includes('file:') 
                ? 'https://boden0323-cyber.github.io/duck-father/' 
                : window.location.href;

            const shareText = `鴨爸爸濱海一路門市《滷味大亨》試營運中！快來玩遊戲提升好評度，免費換抽取式衛生紙與招待現切小菜！ ${gameUrl}`;

            const handleLineShare = () => {
                window.open(`https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`, '_blank');
            };

            const handleCopyLink = () => {
                navigator.clipboard.writeText(gameUrl);
                alert('📋 遊戲網址已複製！快發給 LINE 好友或社群群組！');
            };

            const TASKS = [
                { id: 't1', title: '【初露鋒芒】⭐ 好評度達到 10 星', reward: '現場滿 $100 免費招待「香滷蛋」乙顆', code: 'EGG-FREE', isDone: rep >= 10 },
                { id: 't2', title: '【熟能生巧】⭐ 好評度達到 25 星', reward: '現場滿 $180 免費招待「豆干+滷蛋」小菜雙拼', code: 'SIDE-FREE', isDone: rep >= 25 },
                { id: 't3', title: '【濱海店長】⭐ 好評度達到 50 星', reward: '【集町團購】抽取式衛生紙 1 包免費領', code: 'TISSUE-FREE', isDone: rep >= 50 },
                { id: 't4', title: '【鼓山之光】⭐ 好評度達到 100 星', reward: '現場消費享單筆結帳 9 折優惠', code: 'DUCK-90', isDone: rep >= 100 },
            ];

            return (
                <div className="max-w-md mx-auto h-screen flex flex-col bg-stone-950 text-stone-100 select-none relative">
                    
                    {/* 頂部儀表板 */}
                    <div className="bg-gradient-to-b from-amber-950 to-stone-900 p-3.5 border-b border-amber-800/60 flex justify-between items-center shadow-lg">
                        <div>
                            <div className="text-[10px] text-amber-400 font-bold tracking-widest">鴨爸爸滷味 · 濱海一路門市</div>
                            <div className="text-base font-black text-amber-300">
                                🏠 LV.{shopLevel} {currentShopInfo.name}
                            </div>
                        </div>
                        <div className="text-right flex items-center gap-2">
                            <div>
                                <div className="text-amber-400 font-black text-xs">可用資金: ${money}</div>
                                <div className="text-amber-200/90 font-bold text-[10px]">總營業額: ${totalRevenue}</div>
                                <div className="text-[10px] text-yellow-400 font-black">⭐ 好評度 {rep} 星</div>
                            </div>
                            <button onClick={() => setShowShareModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-xl text-xs font-bold shadow flex flex-col items-center active:scale-95">
                                <span>🟢</span>
                                <span className="text-[9px]">分享</span>
                            </button>
                        </div>
                    </div>

                    {/* Arcade 主場景 */}
                    {currentTab === 'arcade' && (
                        <div className="flex-1 p-3 flex flex-col justify-between overflow-hidden">
                            
                            <div className="bg-stone-900 border-2 border-amber-900/60 rounded-2xl p-4 h-64 relative overflow-hidden shadow-2xl flex flex-col justify-between">
                                <div className="flex justify-between items-start z-10">
                                    <button 
                                        onClick={goToKitchen}
                                        className="bg-amber-950/90 border-2 border-amber-600 p-2.5 rounded-xl text-left hover:scale-105 active:scale-95 transition-all shadow-lg"
                                    >
                                        <div className="text-xs font-bold text-amber-300">
                                            <span>♨️ 廚房備餐檯</span>
                                        </div>
                                        <div className="text-[10px] text-stone-300 mt-1">
                                            {cookingItem ? `已做好: ${cookingItem.icon}${cookingItem.name}` : '無待端餐點'}
                                        </div>
                                        <div className="text-[9px] bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded mt-1 inline-block">
                                            👉 點擊走來取餐
                                        </div>
                                    </button>

                                    <button 
                                        onClick={goToCounter}
                                        className="bg-blue-950/90 border-2 border-blue-500 p-2.5 rounded-xl text-right hover:scale-105 active:scale-95 transition-all shadow-lg"
                                    >
                                        <div className="text-xs font-bold text-blue-300">
                                            {currentCustomer ? `${currentCustomer.avatar} ${currentCustomer.name}` : '門市櫃檯'}
                                        </div>
                                        <div className="text-[10px] text-amber-300 font-bold mt-1">
                                            {currentCustomer ? `需求: ${currentCustomer.order.icon}${currentCustomer.order.name}` : '等候顧客中...'}
                                        </div>
                                        {currentCustomer && (
                                            <div className="text-[9px] text-red-400 mt-0.5">⏳ 耐心: {currentCustomer.timeLeft}s</div>
                                        )}
                                        <div className="text-[9px] bg-blue-500 text-white font-bold px-2 py-0.5 rounded mt-1 inline-block">
                                            👉 點擊走來送餐
                                        </div>
                                    </button>
                                </div>

                                <div 
                                    className={`absolute smooth-move flex flex-col items-center justify-center ${
                                        playerPos === 'kitchen' ? 'left-8 top-28' : playerPos === 'counter' ? 'right-8 top-28' : 'left-1/2 -translate-x-1/2 top-36'
                                    }`}
                                >
                                    {carriedItem && (
                                        <div className="bg-amber-900 border border-amber-500 px-2.5 py-1 rounded-full text-xs font-bold animate-bounce mb-1 text-amber-200">
                                            {carriedItem.icon} {carriedItem.name}
                                        </div>
                                    )}
                                    <div className="relative">
                                        <div className="w-10 h-10 bg-yellow-400 rounded-full border-2 border-amber-600 flex items-center justify-center shadow-lg">
                                            <span className="text-lg">🦆</span>
                                        </div>
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-white text-[8px] font-bold px-1 rounded border border-stone-400 text-stone-900">
                                            廚師帽
                                        </div>
                                    </div>
                                    <span className="text-[10px] font-bold text-amber-300 mt-1 bg-stone-950/80 px-2 py-0.5 rounded">鴨爸爸店長</span>
                                </div>

                                <div className="text-center text-[10px] text-stone-500 z-10">
                                    當前加成：{currentShopInfo.buff}
                                </div>
                            </div>

                            {/* 做菜點餐按鈕區 */}
                            <div className="bg-stone-900 p-3 rounded-2xl border border-stone-800 space-y-2">
                                <div className="text-[10px] text-amber-400 font-bold flex justify-between items-center">
                                    <span>👨‍🍳 選擇菜色做餐：</span>
                                    <span className="text-amber-300 font-bold">
                                        {currentCustomer ? `顧客需求：${currentCustomer.order.icon}${currentCustomer.order.name}` : '暫無顧客'}
                                    </span>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5">
                                    {MENU_ITEMS.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => {
                                                setCookingItem(item);
                                                alert(`♨️ 已開始製作【${item.name}】！請點擊左上角「廚房備餐檯」讓鴨爸爸走過去取餐！`);
                                            }}
                                            className="bg-stone-950 border border-amber-900/40 hover:border-amber-500 p-2 rounded-xl text-center active:scale-95 transition-all shadow"
                                        >
                                            <div className="text-xl mb-0.5">{item.icon}</div>
                                            <div className="text-[10px] font-bold text-stone-200 truncate">{item.name}</div>
                                            <div className="text-[9px] text-amber-400">${item.price}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex justify-between items-center text-[10px] text-stone-500 px-1">
                                <button 
                                    onClick={upgradeShop} 
                                    className="bg-amber-500 hover:bg-amber-400 text-stone-950 font-black px-3 py-1.5 rounded-lg text-xs active:scale-95 shadow"
                                >
                                    🚀 升級門市 {nextShopInfo ? `(需 ⭐${nextShopInfo.reqRep}星 + $${nextShopInfo.reqMoney})` : '(帝國頂峰)'}
                                </button>
                                <button onClick={resetGameData} className="underline text-stone-600 hover:text-stone-400">重置存檔</button>
                            </div>
                        </div>
                    )}

                    {/* 成就任務與實體好禮 */}
                    {currentTab === 'tasks' && (
                        <div className="flex-1 p-4 overflow-y-auto space-y-3">
                            <div className="bg-stone-900 p-3.5 rounded-xl border border-amber-500/60 shadow-lg">
                                <h3 className="font-bold text-amber-300 text-xs mb-1">📜 好評度成就任務 · 現場免費領衛生紙與小菜</h3>
                                <p className="text-[10px] text-stone-400">做對餐點送給客人累積 ⭐ 好評度，好評度達到門檻即可免費兌換實體衛生紙與招待小菜！</p>
                            </div>

                            <div className="space-y-2.5">
                                {TASKS.map(task => (
                                    <div key={task.id} className="bg-stone-900 p-3.5 rounded-xl border border-stone-800 flex justify-between items-center shadow">
                                        <div>
                                            <div className="font-bold text-xs text-amber-200">{task.title}</div>
                                            <div className="text-[10px] text-stone-400 mt-1">獎勵: {task.reward}</div>
                                        </div>
                                        <button 
                                            onClick={() => {
                                                if (!task.isDone) {
                                                    alert('好評度未達門檻！請繼續服務顧客、做出正確餐點！');
                                                    return;
                                                }
                                                setActiveCoupon({
                                                    title: task.title,
                                                    code: task.code,
                                                    desc: task.reward
                                                });
                                            }}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 ${
                                                task.isDone 
                                                    ? 'bg-amber-500 text-stone-950 hover:bg-amber-400 active:scale-95 shadow' 
                                                    : 'bg-stone-800 text-stone-500'
                                            }`}
                                        >
                                            {task.isDone ? '領取獎勵' : '未完成'}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 現場核銷 Modal */}
                    {activeCoupon && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-stone-900 border border-amber-500/80 p-5 rounded-2xl w-full max-w-xs text-center space-y-4 shadow-2xl">
                                <div className="text-3xl">🎟️</div>
                                <h3 className="text-base font-bold text-amber-300">{activeCoupon.title}</h3>
                                <p className="text-xs text-stone-300 leading-relaxed">{activeCoupon.desc}</p>
                                
                                <div className="bg-stone-950 p-3 rounded-xl border border-dashed border-amber-500/50">
                                    <div className="text-[10px] text-stone-400 mb-1">濱海一路門市現場核銷碼</div>
                                    <div className="text-xl font-black tracking-widest text-amber-400">{activeCoupon.code}</div>
                                </div>

                                <button 
                                    onClick={() => {
                                        const msg = `你好！我在《鴨爸爸滷味大亨》完成了【${activeCoupon.title}】，現場核銷碼是：${activeCoupon.code}`;
                                        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, '_blank');
                                        setActiveCoupon(null);
                                    }} 
                                    className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 shadow flex items-center justify-center gap-1"
                                >
                                    <span>🟢</span> 出示至 LINE 官方帳號 / 門市核銷
                                </button>

                                <button onClick={() => setActiveCoupon(null)} className="text-xs text-stone-500 underline block mx-auto pt-1">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* 分享 Modal */}
                    {showShareModal && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-stone-900 border border-amber-700/60 p-5 rounded-2xl w-full max-w-xs text-center space-y-4 shadow-2xl">
                                <h3 className="text-lg font-bold text-amber-300">📢 分享《鴨爸爸滷味大亨》</h3>
                                <p className="text-xs text-stone-400">發送遊戲給好友，邀請大家一起體驗經營樂趣免費換衛生紙！</p>
                                
                                <div className="space-y-2">
                                    <button onClick={handleLineShare} className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 flex items-center justify-center gap-2">
                                        <span>🟢</span> 分享至 LINE 好友 / 群組
                                    </button>
                                    <button onClick={handleCopyLink} className="w-full bg-stone-800 border border-stone-700 text-stone-200 font-bold py-2.5 rounded-xl text-xs active:scale-95">
                                        📋 複製遊戲網址
                                    </button>
                                </div>

                                <button onClick={() => setShowShareModal(false)} className="text-xs text-stone-500 underline pt-2">關閉視窗</button>
                            </div>
                        </div>
                    )}

                    {/* 底部導覽選單 */}
                    <div className="bg-stone-900 border-t border-amber-900/60 flex text-stone-400 text-xs">
                        <button onClick={() => setCurrentTab('arcade')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'arcade' ? 'tab-active' : ''}`}>🎮 門市出餐經營</button>
                        <button onClick={() => setCurrentTab('tasks')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'tasks' ? 'tab-active' : ''}`}>📜 好評成就與衛生紙</button>
                        <button onClick={() => setShowShareModal(true)} className="flex-1 py-3.5 text-center font-bold text-emerald-400">📲 分享好友</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
