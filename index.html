<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鴨爸爸滷味大亨：濱海一路任務兌換版</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #120e0b; color: #eee; user-select: none; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 3px solid #f59e0b; color: #fbbf24; font-weight: bold; }
        #canvas-container { position: relative; width: 340px; height: 320px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 2px solid #78350f; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MENU_ITEMS = [
            { id: 'noodle_dry', name: '古早味乾麵', icon: '🍜', price: 50 },
            { id: 'noodle_sesame', name: '香濃麻醬麵', icon: '🍜', price: 55 },
            { id: 'tofu', name: '招牌豆干', icon: '🧈', price: 30 },
            { id: 'kelp', name: '爽口海帶', icon: '🌿', price: 30 },
            { id: 'ear', name: '秘製豬耳朵', icon: '🐷', price: 60 },
            { id: 'egg', name: '爆汁滷蛋', icon: '🥚', price: 15 },
            { id: 'soup_wonton', name: '鮮美餛飩湯', icon: '🥣', price: 45 },
        ];

        const CUSTOMER_TYPES = [
            { name: '西子灣學生', avatar: '🎓', patience: 15 },
            { name: '哈瑪星美食客', avatar: '🛵', patience: 12 },
            { name: '濱海一路老街坊', avatar: '👵', patience: 18 },
        ];

        function App() {
            const [money, setMoney] = useState(() => Number(localStorage.getItem('duck_money') || 150));
            const [totalRevenue, setTotalRevenue] = useState(() => Number(localStorage.getItem('duck_revenue') || 150));
            const [rep, setRep] = useState(() => Number(localStorage.getItem('duck_rep') || 10));
            const [shopLevel, setShopLevel] = useState(() => Number(localStorage.getItem('duck_level') || 1));

            useEffect(() => { localStorage.setItem('duck_money', money); }, [money]);
            useEffect(() => { localStorage.setItem('duck_revenue', totalRevenue); }, [totalRevenue]);
            useEffect(() => { localStorage.setItem('duck_rep', rep); }, [rep]);
            useEffect(() => { localStorage.setItem('duck_level', shopLevel); }, [shopLevel]);

            const [currentTab, setCurrentTab] = useState('arcade');
            const [activeCoupon, setActiveCoupon] = useState(null);

            const [currentCustomer, setCurrentCustomer] = useState(null);
            const [cookingItem, setCookingItem] = useState(null);

            const canvasRef = useRef(null);

            // 產生顧客邏輯
            useEffect(() => {
                const interval = setInterval(() => {
                    if (!currentCustomer) {
                        const type = CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)];
                        const requestedItem = MENU_ITEMS[Math.floor(Math.random() * MENU_ITEMS.length)];
                        setCurrentCustomer({
                            ...type,
                            order: requestedItem,
                            timeLeft: type.patience
                        });
                    }
                }, 2000);
                return () => clearInterval(interval);
            }, [currentCustomer]);

            // 耐心計時
            useEffect(() => {
                if (!currentCustomer) return;
                const timer = setInterval(() => {
                    setCurrentCustomer(prev => {
                        if (!prev) return null;
                        if (prev.timeLeft <= 1) {
                            setRep(r => Math.max(0, r - 1));
                            return null;
                        }
                        return { ...prev, timeLeft: prev.timeLeft - 1 };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [currentCustomer]);

            // Canvas 平滑移動（修復卡住退回）
            useEffect(() => {
                if (currentTab !== 'arcade' || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                let playerX = 170;
                let playerY = 200;
                let targetX = 170;
                let targetY = 200;
                let carriedItem = null;
                let walkCycle = 0;

                const handlePointerMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    // 放寬移動範圍，不設太嚴格的阻擋邊界
                    targetX = Math.max(20, Math.min(320, clientX - rect.left));
                    targetY = Math.max(20, Math.min(300, clientY - rect.top));
                };

                canvas.addEventListener('mousemove', handlePointerMove);
                canvas.addEventListener('touchmove', handlePointerMove);

                let animId = null;
                let lastCheck = Date.now();

                const render = () => {
                    ctx.clearRect(0, 0, 340, 320);

                    // 1. 地板
                    ctx.fillStyle = '#2d2420'; ctx.fillRect(0, 0, 340, 320);
                    ctx.strokeStyle = '#3e312c'; ctx.lineWidth = 1;
                    for (let i = 0; i < 340; i += 40) {
                        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 320); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(340, i); ctx.stroke();
                    }

                    // 2. 廚房檯 (左上)
                    ctx.fillStyle = '#78350f'; ctx.fillRect(10, 10, 115, 80);
                    ctx.fillStyle = '#451a03'; ctx.fillRect(15, 15, 105, 70);
                    ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; 
                    ctx.fillText('♨️ 廚房備餐檯', 22, 35);
                    if (cookingItem) {
                        ctx.fillStyle = '#fbbf24';
                        ctx.fillText(`已好: ${cookingItem.icon}${cookingItem.name}`, 20, 58);
                    } else {
                        ctx.fillStyle = '#9ca3af';
                        ctx.fillText('請在下方點擊做菜', 20, 58);
                    }

                    // 3. 顧客檯 (右上)
                    ctx.fillStyle = '#1e3a8a'; ctx.fillRect(215, 10, 115, 80);
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(220, 15, 105, 70);
                    if (currentCustomer) {
                        ctx.fillStyle = '#fef08a';
                        ctx.fillText(`${currentCustomer.avatar} ${currentCustomer.name}`, 225, 33);
                        ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 12px sans-serif';
                        ctx.fillText(`想吃: ${currentCustomer.order.icon}${currentCustomer.order.name}`, 225, 53);
                        ctx.fillStyle = '#ef4444'; ctx.font = '10px sans-serif';
                        ctx.fillText(`⏳ 耐心: ${currentCustomer.timeLeft}s`, 225, 72);
                    } else {
                        ctx.fillStyle = '#9ca3af'; ctx.font = '11px sans-serif';
                        ctx.fillText('🚶 等候顧客中...', 228, 50);
                    }

                    // 4. 小人平滑逼近目標點（完全無硬性反彈機制）
                    const dx = targetX - playerX;
                    const dy = targetY - playerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 2) {
                        playerX += (dx / dist) * 3.5;
                        playerY += (dy / dist) * 3.5;
                        walkCycle += 0.25;
                    }

                    // 5. 區域觸發感應（加大感應半徑至 70px，走近就拿/出餐）
                    const now = Date.now();
                    if (now - lastCheck > 250) {
                        lastCheck = now;

                        // 取餐感應 (靠近左上)
                        if (Math.hypot(playerX - 65, playerY - 50) < 70 && cookingItem && !carriedItem) {
                            carriedItem = cookingItem;
                            setCookingItem(null);
                        }

                        // 出餐感應 (靠近右上)
                        if (Math.hypot(playerX - 270, playerY - 50) < 70 && carriedItem && currentCustomer) {
                            if (carriedItem.id === currentCustomer.order.id) {
                                const earn = carriedItem.price;
                                setMoney(m => m + earn);
                                setTotalRevenue(r => r + earn);
                                setRep(r => r + 1);
                                carriedItem = null;
                                setCurrentCustomer(null);
                            }
                        }
                    }

                    // 6. 繪製鴨爸爸小人
                    ctx.save();
                    ctx.translate(playerX, playerY);

                    const legOffset = Math.sin(walkCycle) * 4;
                    ctx.fillStyle = '#f97316';
                    ctx.fillRect(-8, 12 + legOffset, 5, 8);
                    ctx.fillRect(3, 12 - legOffset, 5, 8);

                    ctx.fillStyle = '#dc2626'; // 圍裙
                    ctx.beginPath(); ctx.arc(0, 4, 14, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#facc15'; // 鴨頭
                    ctx.beginPath(); ctx.arc(0, -10, 12, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#000'; // 眼睛
                    ctx.beginPath(); ctx.arc(-4, -13, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(4, -13, 2.5, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#f97316'; // 嘴巴
                    ctx.beginPath(); ctx.ellipse(0, -7, 6, 3, 0, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#ffffff'; // 廚師帽
                    ctx.beginPath(); ctx.arc(0, -22, 10, 0, Math.PI*2); ctx.fill();
                    ctx.fillRect(-8, -20, 16, 5);

                    // 端菜動態
                    if (carriedItem) {
                        ctx.fillStyle = '#78350f'; ctx.fillRect(-14, -38, 28, 10);
                        ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
                        ctx.fillText(carriedItem.icon, -6, -29);
                    }

                    ctx.restore();

                    animId = requestAnimationFrame(render);
                };

                animId = requestAnimationFrame(render);

                return () => {
                    cancelAnimationFrame(animId);
                    canvas.removeEventListener('mousemove', handlePointerMove);
                    canvas.removeEventListener('touchmove', handlePointerMove);
                };
            }, [currentTab, cookingItem, currentCustomer]);

            const upgradeShop = () => {
                const cost = shopLevel * 350;
                if (money < cost) {
                    alert(`資金不足！擴大門市需要 $${cost}`);
                    return;
                }
                setMoney(m => m - cost);
                setShopLevel(l => l + 1);
                alert(`🎊 門市順利升級至 LV.${shopLevel + 1}！`);
            };

            const resetGameData = () => {
                if (confirm('確定要重置所有遊戲進度與營業額嗎？')) {
                    localStorage.clear();
                    setMoney(150);
                    setTotalRevenue(150);
                    setRep(10);
                    setShopLevel(1);
                    alert('遊戲存檔已重置！');
                }
            };

            const TASKS = [
                { id: 't1', title: '【初露鋒芒】累積總營業額達 $500', reward: '門市免費招待「香滷蛋」乙顆', code: 'EGG-FREE', isDone: totalRevenue >= 500 },
                { id: 't2', title: '【熟能生巧】⭐ 好評度達到 15 星', reward: '門市消費滿 $200 折 $30 券', code: 'DUCK-30', isDone: rep >= 15 },
                { id: 't3', title: '【濱海一路店長】累積總營業額達 $1500', reward: '【集町團購】抽取式衛生紙 1 包免費領', code: 'TISSUE-FREE', isDone: totalRevenue >= 1500 },
            ];

            return (
                <div className="max-w-md mx-auto h-screen flex flex-col bg-stone-950 text-stone-100 select-none relative">
                    
                    {/* 頂部儀表板 */}
                    <div className="bg-gradient-to-b from-amber-950 to-stone-900 p-3.5 border-b border-amber-800/60 flex justify-between items-center shadow-lg">
                        <div>
                            <div className="text-[10px] text-amber-400 font-bold tracking-widest">鴨爸爸滷味 · 濱海一路門市</div>
                            <div className="text-base font-black text-amber-300">
                                🏠 LV.{shopLevel} {shopLevel === 1 ? '古早味麵攤' : shopLevel === 2 ? '排隊名店' : '濱海旗艦總店'}
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="text-amber-400 font-black text-xs">可用資金: ${money}</div>
                            <div className="text-amber-200/90 font-bold text-[10px]">總營業額: ${totalRevenue}</div>
                            <div className="text-[10px] text-yellow-400 font-bold">⭐ 好評度 {rep}</div>
                        </div>
                    </div>

                    {/* Arcade 操控遊戲與廚房點餐 */}
                    {currentTab === 'arcade' && (
                        <div className="flex-1 p-3 flex flex-col justify-between overflow-hidden">
                            <div id="canvas-container">
                                <canvas ref={canvasRef} width="340" height="320"></canvas>
                            </div>

                            {/* 點擊製作菜色按鈕區 */}
                            <div className="bg-stone-900 p-2.5 rounded-xl border border-stone-800">
                                <div className="text-[10px] text-amber-400 font-bold mb-1.5 flex justify-between">
                                    <span>👨‍🍳 點擊下方做餐，再滑動小人去端餐：</span>
                                    <span>{currentCustomer ? `需求：${currentCustomer.order.icon}${currentCustomer.order.name}` : '等候顧客'}</span>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5">
                                    {MENU_ITEMS.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => setCookingItem(item)}
                                            className="bg-stone-950 border border-amber-900/40 p-1.5 rounded-lg text-center active:scale-95 hover:border-amber-500"
                                        >
                                            <div className="text-base">{item.icon}</div>
                                            <div className="text-[9px] font-bold text-stone-300 truncate">{item.name}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex justify-between items-center text-[10px] text-stone-500 px-1">
                                <button onClick={upgradeShop} className="bg-amber-500 text-stone-950 font-black px-3 py-1.5 rounded-lg text-xs">🚀 門市升級 (${shopLevel * 350})</button>
                                <button onClick={resetGameData} className="underline text-stone-600">重置存檔</button>
                            </div>
                        </div>
                    )}

                    {/* 任務與實體好禮兌換 */}
                    {currentTab === 'tasks' && (
                        <div className="flex-1 p-4 overflow-y-auto space-y-3">
                            <div className="bg-stone-900 p-3.5 rounded-xl border border-amber-500/60">
                                <h3 className="font-bold text-amber-300 text-xs mb-1">📜 店長成就任務 · 換實體衛生紙與優惠</h3>
                                <p className="text-[10px] text-stone-400">幫顧客做正確的餐點累積好評度與總營業額，達成任務即可現場免費領好禮！</p>
                            </div>

                            <div className="space-y-2.5">
                                {TASKS.map(task => (
                                    <div key={task.id} className="bg-stone-900 p-3.5 rounded-xl border border-stone-800 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-xs text-amber-200">{task.title}</div>
                                            <div className="text-[10px] text-stone-400 mt-1">獎勵: {task.reward}</div>
                                        </div>
                                        <button 
                                            onClick={() => {
                                                if (!task.isDone) {
                                                    alert('任務尚未完成！請繼續出餐提升好評度與營業額！');
                                                    return;
                                                }
                                                setActiveCoupon({
                                                    title: task.title,
                                                    code: task.code,
                                                    desc: task.reward
                                                });
                                            }}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 ${
                                                task.isDone 
                                                    ? 'bg-amber-500 text-stone-950 hover:bg-amber-400 active:scale-95 shadow' 
                                                    : 'bg-stone-800 text-stone-500'
                                            }`}
                                        >
                                            {task.isDone ? '領取獎勵' : '未完成'}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 現場核銷 Modal */}
                    {activeCoupon && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-stone-900 border border-amber-500/80 p-5 rounded-2xl w-full max-w-xs text-center space-y-4 shadow-2xl">
                                <div className="text-3xl">🎟️</div>
                                <h3 className="text-base font-bold text-amber-300">{activeCoupon.title}</h3>
                                <p className="text-xs text-stone-300 leading-relaxed">{activeCoupon.desc}</p>
                                
                                <div className="bg-stone-950 p-3 rounded-xl border border-dashed border-amber-500/50">
                                    <div className="text-[10px] text-stone-400 mb-1">濱海一路門市現場核銷碼</div>
                                    <div className="text-xl font-black tracking-widest text-amber-400">{activeCoupon.code}</div>
                                </div>

                                <button 
                                    onClick={() => {
                                        const msg = `你好！我在《鴨爸爸滷味大亨》完成了【${activeCoupon.title}】，現場核銷碼是：${activeCoupon.code}`;
                                        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, '_blank');
                                        setActiveCoupon(null);
                                    }} 
                                    className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 shadow flex items-center justify-center gap-1"
                                >
                                    <span>🟢</span> 出示至 LINE 官方帳號 / 門市核銷
                                </button>

                                <button onClick={() => setActiveCoupon(null)} className="text-xs text-stone-500 underline block mx-auto pt-1">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* 底部選單 */}
                    <div className="bg-stone-900 border-t border-amber-900/60 flex text-stone-400 text-xs">
                        <button onClick={() => setCurrentTab('arcade')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'arcade' ? 'tab-active' : ''}`}>🎮 門市出餐經營</button>
                        <button onClick={() => setCurrentTab('tasks')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'tasks' ? 'tab-active' : ''}`}>📜 成就任務與衛生紙</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
