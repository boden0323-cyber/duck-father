<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鴨爸爸滷味大亨：濱海一路門市實體兌換版</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #120e0b; color: #eee; user-select: none; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 3px solid #f59e0b; color: #fbbf24; font-weight: bold; }
        #canvas-container { position: relative; width: 340px; height: 320px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 2px solid #78350f; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 濱海一路門市現場菜單全集
        const MENU_ITEMS = [
            // 麵食類
            { id: 'noodle_dry', name: '古早味乾麵', icon: '🍜', price: 50, cat: 'noodle' },
            { id: 'noodle_sesame', name: '香濃麻醬麵', icon: '🍜', price: 55, cat: 'noodle' },
            { id: 'noodle_rice', name: '懷舊米粉湯', icon: '🍲', price: 50, cat: 'noodle' },

            // 招牌黑白切滷味
            { id: 'tofu', name: '招牌豆干', icon: '🧈', price: 30, cat: 'luwei' },
            { id: 'kelp', name: '爽口海帶', icon: '🌿', price: 30, cat: 'luwei' },
            { id: 'ear', name: '秘製豬耳朵', icon: '🐷', price: 60, cat: 'luwei' },
            { id: 'pig_head', name: '香滷豬頭皮', icon: '🐷', price: 60, cat: 'luwei' },
            { id: 'pig_skin', name: 'Q彈豬皮', icon: '🥓', price: 30, cat: 'luwei' },
            { id: 'intestine', name: '香滷大腸頭', icon: '🍢', price: 100, cat: 'luwei' },
            { id: 'egg', name: '爆汁滷蛋', icon: '🥚', price: 15, cat: 'luwei' },
            { id: 'duck_intestine', name: '脆口鴨腸', icon: '🥢', price: 60, cat: 'luwei' },
            { id: 'duck_liver', name: '粉嫩鴨肝', icon: '🟤', price: 40, cat: 'luwei' },
            { id: 'duck_wing', name: '香滷鴨翅', icon: '🍗', price: 35, cat: 'luwei' },
            { id: 'duck_gizzard', name: '嚼勁鴨腱', icon: '🍖', price: 50, cat: 'luwei' },
            { id: 'pig_tongue', name: '嫩滷豬舌頭', icon: '👅', price: 70, cat: 'luwei' },
            { id: 'pig_pipe', name: '爽脆豬軟管', icon: '🦴', price: 60, cat: 'luwei' },

            // 暖心湯品
            { id: 'soup_wonton', name: '鮮美餛飩湯', icon: '🥣', price: 45, cat: 'soup' },
            { id: 'soup_fishball', name: '彈牙魚丸湯', icon: '🍡', price: 35, cat: 'soup' },
            { id: 'soup_meatball', name: '扎實貢丸湯', icon: '🧆', price: 35, cat: 'soup' },

            // 遊戲趣味隱藏彩蛋料理
            { id: 'special_feet', name: '霸王鴨掌', icon: '🦆', price: 80, cat: 'special' },
            { id: 'special_king', name: '秘製老滷大霸王拼盤', icon: '👑', price: 200, cat: 'special' }
        ];

        // 門市現場實體兌換獎勵 (O2O 導流閉環)
        const REAL_REWARDS = [
            { id: 'r_tissue', name: '【集町團購】抽取式衛生紙 1 包', costType: 'revenue', cost: 1500, icon: '🧻', desc: '做菜累積總營業額 $1500，憑券至高雄濱海一路門市現場免費領取！', code: 'TISSUE-FREE' },
            { id: 'r_tofu', name: '【門市招待】現切招牌豆干 乙份', costType: 'revenue', cost: 800, icon: '🧈', desc: '現場消費出示，免費招待爆汁現切招牌豆干乙份！', code: 'TOFU-FREE' },
            { id: 'r_egg', name: '【門市招待】入味香滷蛋 乙顆', costType: 'revenue', cost: 500, icon: '🥚', desc: '現場消費出示，免費加菜香滷蛋乙顆！', code: 'EGG-FREE' },
            { id: 'r_coupon', name: '【現場消費】滿 $200 折 $30 優惠券', costType: 'level', cost: 2, icon: '🎟️', desc: '門市升級至 LV.2 解鎖，現場結帳直接折抵 $30！', code: 'DUCK-30' },
        ];

        const CUSTOMER_TYPES = [
            { name: '西子灣學生', avatar: '🎓', patience: 12 },
            { name: '哈瑪星美食客', avatar: '🛵', patience: 10 },
            { name: '濱海一路老街坊', avatar: '👵', patience: 15 },
            { name: '集町團購團友', avatar: '📦', patience: 18 },
        ];

        function App() {
            // 從 localStorage 自動恢復存檔
            const [money, setMoney] = useState(() => Number(localStorage.getItem('duck_money') || 150));
            const [totalRevenue, setTotalRevenue] = useState(() => Number(localStorage.getItem('duck_revenue') || 150));
            const [rep, setRep] = useState(() => Number(localStorage.getItem('duck_rep') || 10));
            const [shopLevel, setShopLevel] = useState(() => Number(localStorage.getItem('duck_level') || 1));

            // 自動永久存檔
            useEffect(() => { localStorage.setItem('duck_money', money); }, [money]);
            useEffect(() => { localStorage.setItem('duck_revenue', totalRevenue); }, [totalRevenue]);
            useEffect(() => { localStorage.setItem('duck_rep', rep); }, [rep]);
            useEffect(() => { localStorage.setItem('duck_level', shopLevel); }, [shopLevel]);

            const [currentTab, setCurrentTab] = useState('arcade');
            const [activeCoupon, setActiveCoupon] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState('all');

            const canvasRef = useRef(null);

            // Canvas 2D 卡通 Arcade Idle 遊戲繪製
            useEffect(() => {
                if (currentTab !== 'arcade' || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                let playerX = 170;
                let playerY = 200;
                let targetX = 170;
                let targetY = 200;
                let carriedFood = 0;
                const maxCarry = 3;
                let walkCycle = 0;

                const handlePointerMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    targetX = Math.max(30, Math.min(310, clientX - rect.left));
                    targetY = Math.max(30, Math.min(290, clientY - rect.top));
                };

                canvas.addEventListener('mousemove', handlePointerMove);
                canvas.addEventListener('touchmove', handlePointerMove);

                let animId = null;
                let lastTime = Date.now();

                const render = () => {
                    ctx.clearRect(0, 0, 340, 320);

                    // 1. 地板與氛圍繪製
                    ctx.fillStyle = '#2d2420'; ctx.fillRect(0, 0, 340, 320);
                    ctx.strokeStyle = '#3e312c'; ctx.lineWidth = 1;
                    for (let i = 0; i < 340; i += 40) {
                        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 320); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(340, i); ctx.stroke();
                    }

                    // 2. 廚房區：黑白切與老滷檯 (左上)
                    ctx.fillStyle = '#78350f'; ctx.fillRect(20, 20, 100, 75);
                    ctx.fillStyle = '#451a03'; ctx.fillRect(25, 25, 90, 65);
                    ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(50, 58, 18, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(50, 58, 13, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText('♨️ 鴨爸爸老滷', 30, 38);

                    // 3. 顧客檯 (右上)
                    ctx.fillStyle = '#1e3a8a'; ctx.fillRect(220, 20, 100, 75);
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(225, 25, 90, 65);
                    ctx.fillText('🧍 門市櫃檯', 240, 38);
                    ctx.fillText('👵 老街坊 / 學生', 230, 65);

                    // 4. 平滑移動
                    const dx = targetX - playerX;
                    const dy = targetY - playerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 3) {
                        playerX += (dx / dist) * 2.8;
                        playerY += (dy / dist) * 2.8;
                        walkCycle += 0.2;
                    }

                    // 區域感應
                    const now = Date.now();
                    if (now - lastTime > 400) {
                        lastTime = now;
                        // 取餐
                        if (Math.hypot(playerX - 70, playerY - 58) < 55) {
                            if (carriedFood < maxCarry) carriedFood++;
                        }
                        // 出餐
                        if (Math.hypot(playerX - 270, playerY - 58) < 55) {
                            if (carriedFood > 0) {
                                carriedFood--;
                                setMoney(m => m + 45);
                                setTotalRevenue(r => r + 45);
                            }
                        }
                    }

                    // 5. 卡通鴨爸爸小人繪製
                    ctx.save();
                    ctx.translate(playerX, playerY);

                    const legOffset = Math.sin(walkCycle) * 4;
                    ctx.fillStyle = '#f97316';
                    ctx.fillRect(-8, 12 + legOffset, 5, 8);
                    ctx.fillRect(3, 12 - legOffset, 5, 8);

                    ctx.fillStyle = '#dc2626'; // 圍裙
                    ctx.beginPath(); ctx.arc(0, 4, 14, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#facc15'; // 鴨頭
                    ctx.beginPath(); ctx.arc(0, -10, 12, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#000'; // 眼睛
                    ctx.beginPath(); ctx.arc(-4, -13, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(4, -13, 2.5, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#f97316'; // 嘴巴
                    ctx.beginPath(); ctx.ellipse(0, -7, 6, 3, 0, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#ffffff'; // 廚師帽
                    ctx.beginPath(); ctx.arc(0, -22, 10, 0, Math.PI*2); ctx.fill();
                    ctx.fillRect(-8, -20, 16, 5);

                    // 頭頂餐盤堆疊
                    if (carriedFood > 0) {
                        for (let i = 0; i < carriedFood; i++) {
                            ctx.fillStyle = '#78350f';
                            ctx.fillRect(-12, -35 - (i * 12), 24, 8);
                            ctx.fillStyle = '#fbbf24';
                            ctx.fillText('🍱', -7, -27 - (i * 12));
                        }
                    }

                    ctx.restore();

                    animId = requestAnimationFrame(render);
                };

                animId = requestAnimationFrame(render);

                return () => {
                    cancelAnimationFrame(animId);
                    canvas.removeEventListener('mousemove', handlePointerMove);
                    canvas.removeEventListener('touchmove', handlePointerMove);
                };
            }, [currentTab]);

            const upgradeShop = () => {
                const cost = shopLevel * 350;
                if (money < cost) {
                    alert(`資金不足！擴大門市需要 $${cost}`);
                    return;
                }
                setMoney(m => m - cost);
                setShopLevel(l => l + 1);
                alert(`🎊 門市順利升級至 LV.${shopLevel + 1}！知名度大增！`);
            };

            const resetGameData = () => {
                if (confirm('確定要重置所有遊戲進度與營業額嗎？')) {
                    localStorage.clear();
                    setMoney(150);
                    setTotalRevenue(150);
                    setRep(10);
                    setShopLevel(1);
                    alert('遊戲存檔已重置！');
                }
            };

            const filteredMenu = selectedCategory === 'all' 
                ? MENU_ITEMS 
                : MENU_ITEMS.filter(item => item.cat === selectedCategory);

            return (
                <div className="max-w-md mx-auto h-screen flex flex-col bg-stone-950 text-stone-100 select-none relative">
                    
                    {/* 頂部營運儀表板 */}
                    <div className="bg-gradient-to-b from-amber-950 to-stone-900 p-3.5 border-b border-amber-800/60 flex justify-between items-center shadow-lg">
                        <div>
                            <div className="text-[10px] text-amber-400 font-bold tracking-widest flex items-center gap-1">
                                <span>鴨爸爸滷味</span>
                                <span className="text-amber-600">·</span>
                                <span>濱海一路門市</span>
                            </div>
                            <div className="text-base font-black text-amber-300">
                                🏠 LV.{shopLevel} {shopLevel === 1 ? '古早味麵攤' : shopLevel === 2 ? '排隊名店' : '濱海旗艦總店'}
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="text-amber-400 font-black text-xs">可用資金: ${money}</div>
                            <div className="text-amber-200/90 font-bold text-[10px]">總營業額: ${totalRevenue}</div>
                            <div className="text-[10px] text-stone-400">⭐ 好評 {rep}</div>
                        </div>
                    </div>

                    {/* Arcade 操控遊戲主畫面 */}
                    {currentTab === 'arcade' && (
                        <div className="flex-1 p-3 flex flex-col justify-between overflow-hidden">
                            <div className="text-center text-xs text-stone-400 mb-1">
                                👆 點擊/拖曳畫面操控鴨爸爸：至「老滷檯」取餐 ➔ 送給「門市顧客」
                            </div>

                            <div id="canvas-container">
                                <canvas ref={canvasRef} width="340" height="320"></canvas>
                            </div>

                            <div className="space-y-2 mt-2">
                                <button
                                    onClick={upgradeShop}
                                    className="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-stone-950 font-black py-2.5 rounded-xl text-xs shadow-lg active:scale-95"
                                >
                                    🚀 擴大門市等級 (需 ${shopLevel * 350} 營業金)
                                </button>
                                <div className="flex justify-between items-center text-[10px] text-stone-500 px-1">
                                    <span>💾 進度已自動儲存於瀏覽器</span>
                                    <button onClick={resetGameData} className="underline text-stone-600 hover:text-stone-400">重置遊戲進度</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 門市現場美味菜單 */}
                    {currentTab === 'menu' && (
                        <div className="flex-1 p-4 overflow-y-auto space-y-3">
                            <div className="flex gap-1.5 overflow-x-auto pb-1 text-xs">
                                {[
                                    { id: 'all', name: '全部美味' },
                                    { id: 'luwei', name: '招牌黑白切' },
                                    { id: 'noodle', name: '古早味麵食' },
                                    { id: 'soup', name: '暖心湯品' },
                                    { id: 'special', name: '隱藏菜色' }
                                ].map(cat => (
                                    <button 
                                        key={cat.id}
                                        onClick={() => setSelectedCategory(cat.id)}
                                        className={`px-3 py-1.5 rounded-lg shrink-0 font-bold ${
                                            selectedCategory === cat.id 
                                                ? 'bg-amber-500 text-stone-950' 
                                                : 'bg-stone-900 text-stone-400 border border-stone-800'
                                        }`}
                                    >
                                        {cat.name}
                                    </button>
                                ))}
                            </div>

                            <div className="grid grid-cols-2 gap-2.5">
                                {filteredMenu.map(item => (
                                    <div key={item.id} className="bg-stone-900 p-3 rounded-xl border border-stone-800 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <span className="text-2xl">{item.icon}</span>
                                            <div>
                                                <div className="font-bold text-xs text-stone-200">{item.name}</div>
                                                <div className="text-[10px] text-amber-400 font-bold">${item.price}</div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 現場實體禮品兌換區 */}
                    {currentTab === 'reward' && (
                        <div className="flex-1 p-4 overflow-y-auto space-y-3">
                            <div className="bg-stone-900 p-3 rounded-xl border border-amber-500/60">
                                <h3 className="font-bold text-amber-300 text-xs">🎁 免看廣告！玩遊戲直接現場換好禮</h3>
                                <p className="text-[10px] text-stone-400">做菜累積總營業額，憑券至高雄濱海一路門市免費領取抽取式衛生紙或招待現切滷味！</p>
                            </div>

                            <div className="space-y-2.5">
                                {REAL_REWARDS.map(reward => {
                                    const canClaim = reward.costType === 'revenue' 
                                        ? totalRevenue >= reward.cost 
                                        : shopLevel >= reward.cost;

                                    return (
                                        <div key={reward.id} className="bg-stone-900 p-3.5 rounded-xl border border-stone-800 flex justify-between items-center">
                                            <div className="flex gap-3 items-center">
                                                <span className="text-3xl">{reward.icon}</span>
                                                <div>
                                                    <div className="font-bold text-xs text-amber-200">{reward.name}</div>
                                                    <div className="text-[10px] text-stone-400 leading-tight mt-0.5">{reward.desc}</div>
                                                    <div className="text-[10px] text-amber-400 font-bold mt-1">
                                                        門檻: {reward.costType === 'revenue' ? `總營業額 $${reward.cost}` : `門市 LV.${reward.cost}`}
                                                    </div>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    if (!canClaim) {
                                                        alert('未達兌換門檻！請繼續操控鴨爸爸送餐賺取營業額！');
                                                        return;
                                                    }
                                                    setActiveCoupon({
                                                        title: reward.name,
                                                        code: reward.code,
                                                        desc: reward.desc
                                                    });
                                                }}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 ${
                                                    canClaim 
                                                        ? 'bg-amber-500 text-stone-950 hover:bg-amber-400 active:scale-95 shadow' 
                                                        : 'bg-stone-800 text-stone-500'
                                                }`}
                                            >
                                                {canClaim ? '現場兌換' : '未達門檻'}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* 兌換/核銷 Modal */}
                    {activeCoupon && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-stone-900 border border-amber-500/80 p-5 rounded-2xl w-full max-w-xs text-center space-y-4 shadow-2xl">
                                <div className="text-3xl">🎟️</div>
                                <h3 className="text-base font-bold text-amber-300">{activeCoupon.title}</h3>
                                <p className="text-xs text-stone-300 leading-relaxed">{activeCoupon.desc}</p>
                                
                                <div className="bg-stone-950 p-3 rounded-xl border border-dashed border-amber-500/50">
                                    <div className="text-[10px] text-stone-400 mb-1">濱海一路門市現場核銷碼</div>
                                    <div className="text-xl font-black tracking-widest text-amber-400">{activeCoupon.code}</div>
                                </div>

                                <button 
                                    onClick={() => {
                                        const msg = `你好！我在《鴨爸爸滷味大亨》兌換了【${activeCoupon.title}】，現場核銷碼是：${activeCoupon.code}`;
                                        window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, '_blank');
                                        setActiveCoupon(null);
                                    }} 
                                    className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs active:scale-95 shadow flex items-center justify-center gap-1"
                                >
                                    <span>🟢</span> 出示至 LINE 官方帳號 / 門市核銷
                                </button>

                                <button onClick={() => setActiveCoupon(null)} className="text-xs text-stone-500 underline block mx-auto pt-1">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* 底部導覽選單 */}
                    <div className="bg-stone-900 border-t border-amber-900/60 flex text-stone-400 text-xs">
                        <button onClick={() => setCurrentTab('arcade')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'arcade' ? 'tab-active' : ''}`}>🎮 鴨爸爸門市</button>
                        <button onClick={() => setCurrentTab('menu')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'menu' ? 'tab-active' : ''}`}>🍜 現場菜單</button>
                        <button onClick={() => setCurrentTab('reward')} className={`flex-1 py-3.5 text-center font-bold ${currentTab === 'reward' ? 'tab-active' : ''}`}>🎁 現場好禮兌換</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
